<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL Structure & Written Expression · Latihan Soal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="icon" href="asset/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0f0e1a, #1a1a2e);
            padding: 20px;
            color: #f0f3fa;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        /* ===== HEADER MATCHING WORDS ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px 0 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header-left .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #9ca3cf;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .header-left .back-btn:hover {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.3);
            transform: translateX(-3px);
        }

        .header-title-box h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #fde047, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .header-title-box p {
            color: #9ca3cf;
            font-size: 13px;
            margin-top: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-right .badge {
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.25);
            padding: 6px 18px;
            border-radius: 40px;
            color: #fbbf24;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== SCORE BAR MATCHING WORDS ===== */
        .score-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .score-bar .item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #9ca3cf;
        }

        .score-bar .item .num {
            font-weight: 700;
            font-size: 18px;
        }

        .score-bar .item .num.green {
            color: #34d399;
        }

        .score-bar .item .num.gold {
            color: #fbbf24;
        }

        .score-bar .item .num.cyan {
            color: #38bdf8;
        }

        /* Progress Bar */
        .progress-bar {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            height: 8px;
            margin-bottom: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .progress-fill {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 12px;
        }

        /* ===== SOAL CARD ===== */
        .soal-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 32px 28px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            animation: fadeIn 0.3s ease;
        }

        .soal-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .soal-number {
            background: rgba(251, 191, 36, 0.12);
            color: #fbbf24;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid rgba(251, 191, 36, 0.25);
        }

        .soal-type-badge {
            background: rgba(255, 255, 255, 0.05);
            color: #9ca3cf;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .soal-text {
            font-size: 20px;
            line-height: 1.6;
            color: #f8fafc;
            margin-bottom: 24px;
            padding: 22px 24px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .soal-text strong {
            color: #f87171;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* ===== OPTIONS GRID / LIST ===== */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .option-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.07);
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }

        .option-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(251, 191, 36, 0.3);
            transform: translateX(4px);
        }

        .option-letter {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #9ca3cf;
            transition: all 0.2s;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .option-label {
            flex: 1;
            font-size: 16px;
            color: #e2e8f0;
            font-weight: 500;
            line-height: 1.4;
        }

        .option-icon {
            font-size: 18px;
            display: none;
        }

        /* Option States */
        .option-card.selected {
            background: rgba(251, 191, 36, 0.12);
            border-color: #fbbf24;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.15);
        }

        .option-card.selected .option-letter {
            background: #fbbf24;
            color: #1a1a2e;
        }

        .option-card.correct {
            background: rgba(52, 211, 153, 0.15) !important;
            border-color: #34d399 !important;
            box-shadow: 0 4px 20px rgba(52, 211, 153, 0.2) !important;
        }

        .option-card.correct .option-letter {
            background: #34d399 !important;
            color: #1a1a2e !important;
        }

        .option-card.correct .option-icon {
            display: block;
            color: #34d399;
        }

        .option-card.wrong {
            background: rgba(244, 63, 94, 0.15) !important;
            border-color: #f43f5e !important;
            box-shadow: 0 4px 20px rgba(244, 63, 94, 0.2) !important;
        }

        .option-card.wrong .option-letter {
            background: #f43f5e !important;
            color: #fff !important;
        }

        .option-card.wrong .option-icon {
            display: block;
            color: #f43f5e;
        }

        .option-card.correct-highlight {
            border-color: #34d399 !important;
            background: rgba(52, 211, 153, 0.08) !important;
        }

        .option-card.correct-highlight .option-letter {
            border-color: #34d399;
            color: #34d399;
        }

        .option-card.disabled {
            cursor: default;
            pointer-events: none;
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn-group button {
            flex: 1;
            min-width: 140px;
            padding: 13px 20px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-check {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a1a2e;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(245, 158, 11, 0.4);
            filter: brightness(1.1);
        }

        .btn-next {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25) !important;
            color: #38bdf8;
        }

        .btn-next:hover {
            background: rgba(56, 189, 248, 0.2);
            transform: translateY(-2px);
        }

        .btn-pembahasan {
            background: rgba(167, 139, 250, 0.12);
            border: 1px solid rgba(167, 139, 250, 0.25) !important;
            color: #c084fc;
        }

        .btn-pembahasan:hover {
            background: rgba(167, 139, 250, 0.2);
            transform: translateY(-2px);
        }

        .btn-reset {
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.25) !important;
            color: #f43f5e;
        }

        .btn-reset:hover {
            background: rgba(244, 63, 94, 0.2);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ===== FEEDBACK TOASTS ===== */
        .feedback {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 16px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.3s ease;
            line-height: 1.5;
        }

        .feedback.correct {
            display: block;
            background: rgba(52, 211, 153, 0.12);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .feedback.wrong {
            display: block;
            background: rgba(244, 63, 94, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        /* Pembahasan */
        .pembahasan {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            border-left: 4px solid #c084fc;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .pembahasan.show {
            display: block;
        }

        .pembahasan h4 {
            color: #c084fc;
            margin-bottom: 8px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pembahasan p {
            color: #cbd5e1;
            line-height: 1.6;
            font-size: 14.5px;
        }

        /* ===== HASIL AKHIR (RESULT CARD) ===== */
        .result-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.5s ease;
        }

        .result-card h2 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fde047, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        .final-score {
            font-size: 54px;
            font-weight: 800;
            color: #34d399;
            margin: 15px 0;
            font-family: 'JetBrains Mono', monospace;
        }

        .toefl-score {
            font-size: 24px;
            color: #fbbf24;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .predicate {
            font-size: 16px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 24px;
        }

        .predicate.excellent {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .predicate.good {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .predicate.fair {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .btn-restart {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a1a2e;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* Review Section */
        .review-section {
            margin-top: 30px;
            text-align: left;
            max-height: 440px;
            overflow-y: auto;
            padding-right: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .review-item {
            padding: 16px 20px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-left: 4px solid #f43f5e;
        }

        .review-question {
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .review-user-ans {
            color: #fca5a5;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .review-correct-ans {
            color: #34d399;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .review-pembahasan {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed rgba(255, 255, 255, 0.08);
        }

        /* Footer */
        .footer {
            text-align: center;
            color: #4a4a6a;
            padding: 30px 0 10px;
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 30px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            animation: fall 2s linear forwards;
            z-index: 1000;
            pointer-events: none;
            border-radius: 50%;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            body {
                padding: 14px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .header-title-box h1 {
                font-size: 22px;
            }

            .soal-card,
            .result-card {
                padding: 20px 16px;
                border-radius: 20px;
            }

            .soal-text {
                font-size: 17px;
                padding: 16px;
            }

            .option-card {
                padding: 12px 14px;
            }

            .option-label {
                font-size: 14.5px;
            }

            .btn-group button {
                font-size: 12.5px;
                padding: 11px 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Top Header with Back to Dashboard -->
        <div class="header">
            <div class="header-left">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
                <div class="header-title-box">
                    <h1>🏆 TOEFL Practice</h1>
                    <p>Structure & Written Expression</p>
                </div>
            </div>
            <div class="header-right">
                <span class="badge"><i class="fas fa-graduation-cap"></i> 100 Soal Lengkap</span>
            </div>
        </div>

        <!-- Info / Score Bar -->
        <div class="score-bar">
            <div class="item">
                <i class="fas fa-check-circle" style="color:#34d399;"></i>
                <span>Skor:</span>
                <span class="num green" id="score">0</span>
            </div>
            <div class="item">
                <i class="fas fa-list-ol" style="color:#fbbf24;"></i>
                <span>Soal:</span>
                <span class="num gold" id="currentQuestionDisplay">1 / 100</span>
            </div>
            <div class="item">
                <i class="fas fa-clock" style="color:#38bdf8;"></i>
                <span id="timer">00:00</span>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- Container Soal / Hasil -->
        <div id="soalContainer"></div>

        <div class="footer">
            <p>✨ TOEFL Structure & Written Expression Practice · Dibuat untuk Meningkatkan Skor TOEFL Kamu</p>
        </div>
    </div>

    <script>
        // ============ DATABASE SOAL TOEFL (100 SOAL) ============
        const toeflQuestions = [
            // Structure Questions (1-25)
            { type: "structure", text: "The committee ________ to approve the budget yesterday.", options: ["decide", "decided", "deciding", "has decided"], answer: 1, pembahasan: "Kata 'yesterday' menunjukkan waktu lampau, jadi menggunakan Simple Past (decided)." },
            { type: "structure", text: "She is the woman ________ won the competition.", options: ["who", "which", "whom", "whose"], answer: 0, pembahasan: "'Who' digunakan untuk menerangkan orang sebagai subjek." },
            { type: "structure", text: "If I ________ you, I would take the job.", options: ["am", "was", "were", "be"], answer: 2, pembahasan: "Conditional type 2 menggunakan 'were' untuk semua subjek." },
            { type: "structure", text: "They ________ dinner when I arrived.", options: ["had", "were having", "have", "are having"], answer: 1, pembahasan: "Past Continuous untuk kejadian sedang berlangsung ketika kejadian lain terjadi." },
            { type: "structure", text: "This is the book ________ I told you about.", options: ["who", "whom", "which", "whose"], answer: 2, pembahasan: "'Which' digunakan untuk menerangkan benda." },
            { type: "structure", text: "By next year, I ________ here for 10 years.", options: ["work", "will work", "will have worked", "have worked"], answer: 2, pembahasan: "Future Perfect untuk kejadian yang akan selesai di masa depan." },
            { type: "structure", text: "She speaks English ________ than her brother.", options: ["good", "well", "better", "best"], answer: 2, pembahasan: "Comparative menggunakan 'better' (good → better)." },
            { type: "structure", text: "Neither the teacher nor the students ________ in the classroom.", options: ["is", "am", "are", "be"], answer: 2, pembahasan: "Subject setelah 'nor' menentukan verb (students = plural → are)." },
            { type: "structure", text: "I wish I ________ more time to travel.", options: ["have", "had", "have had", "will have"], answer: 1, pembahasan: "Wish untuk kondisi tidak nyata menggunakan past tense." },
            { type: "structure", text: "The movie was ________ boring that I fell asleep.", options: ["so", "such", "very", "too"], answer: 0, pembahasan: "'So + adjective + that' menunjukkan akibat." },
            { type: "structure", text: "She is looking forward to ________ her family.", options: ["see", "seeing", "saw", "seen"], answer: 1, pembahasan: "'Look forward to' diikuti gerund (V-ing)." },
            { type: "structure", text: "Had he known, he ________ differently.", options: ["would act", "acted", "would have acted", "acts"], answer: 2, pembahasan: "Inversion conditional type 3: Had + S + V3, S + would have + V3." },
            { type: "structure", text: "This is the most delicious cake I ________.", options: ["ever eat", "have ever eaten", "ever ate", "was eating"], answer: 1, pembahasan: "Present Perfect untuk pengalaman seumur hidup." },
            { type: "structure", text: "The manager made his employees ________ overtime.", options: ["work", "to work", "working", "worked"], answer: 0, pembahasan: "Make + object + V1 (bare infinitive)." },
            { type: "structure", text: "________ the weather was bad, we continued the trip.", options: ["Although", "Because", "Despite", "However"], answer: 0, pembahasan: "'Although' diikuti klausa (S + V)." },
            { type: "structure", text: "She suggested ________ to the beach.", options: ["go", "to go", "going", "went"], answer: 2, pembahasan: "'Suggest' diikuti gerund." },
            { type: "structure", text: "The more you practice, ________ you will get.", options: ["better", "the better", "best", "the best"], answer: 1, pembahasan: "The + comparative, the + comparative." },
            { type: "structure", text: "By the time we arrived, the movie ________.", options: ["started", "was starting", "has started", "had started"], answer: 3, pembahasan: "Past Perfect untuk kejadian yang selesai sebelum kejadian lain." },
            { type: "structure", text: "He is known ________ a great leader.", options: ["as", "like", "to be", "being"], answer: 0, pembahasan: "'Known as' berarti dikenal sebagai." },
            { type: "structure", text: "Not only ________ late, but he also forgot the tickets.", options: ["he was", "was he", "he is", "is he"], answer: 1, pembahasan: "Inversion setelah 'Not only'." },
            { type: "structure", text: "She has ________ her mind about the decision.", options: ["change", "changed", "changing", "to change"], answer: 1, pembahasan: "Present Perfect: have + V3." },
            { type: "structure", text: "The students, ________ have finished the exam, may leave.", options: ["who", "whom", "which", "whose"], answer: 0, pembahasan: "'Who' menerangkan 'the students' sebagai subjek." },
            { type: "structure", text: "I'd rather you ________ quiet.", options: ["keep", "kept", "to keep", "keeping"], answer: 1, pembahasan: "'Would rather + subject + past tense' untuk harapan." },
            { type: "structure", text: "The house ________ green is my aunt's.", options: ["painted", "painting", "to paint", "paints"], answer: 0, pembahasan: "Past participle sebagai adjective (the house that is painted)." },
            { type: "structure", text: "She is accustomed to ________ early.", options: ["wake up", "waking up", "woke up", "wakes up"], answer: 1, pembahasan: "'Accustomed to' + gerund." },

            // Written Expression Questions (26-50)
            { type: "error", text: "The professor, together with his students, <strong>are</strong> going to the conference.", options: ["The professor", "together with", "are", "to the conference"], answer: 2, pembahasan: "Subject 'The professor' singular, harusnya 'is', bukan 'are'." },
            { type: "error", text: "She <strong>don't</strong> like spicy food.", options: ["She", "don't", "like", "spicy food"], answer: 1, pembahasan: "She adalah singular, harusnya 'doesn't', bukan 'don't'." },
            { type: "error", text: "If I <strong>was</strong> rich, I would buy a car.", options: ["If I", "was", "would buy", "a car"], answer: 1, pembahasan: "Conditional type 2 menggunakan 'were' untuk semua subjek." },
            { type: "error", text: "He has <strong>went</strong> to Jakarta yesterday.", options: ["He", "has went", "to Jakarta", "yesterday"], answer: 1, pembahasan: "Present Perfect perlu V3, 'went' harusnya 'gone'." },
            { type: "error", text: "This is the <strong>more</strong> beautiful painting I've ever seen.", options: ["This is", "more", "beautiful painting", "I've ever seen"], answer: 1, pembahasan: "Superlative menggunakan 'most', bukan 'more'." },
            { type: "error", text: "She <strong>enjoy</strong> reading novels in her free time.", options: ["She", "enjoy", "reading", "in her free time"], answer: 1, pembahasan: "She (singular) → enjoys." },
            { type: "error", text: "Neither the manager nor the employees <strong>is</strong> happy with the decision.", options: ["Neither", "nor the employees", "is", "with the decision"], answer: 2, pembahasan: "Subject setelah 'nor' (employees) plural → 'are'." },
            { type: "error", text: "I look forward to <strong>meet</strong> you soon.", options: ["I look", "forward to", "meet", "you soon"], answer: 2, pembahasan: "'Look forward to' + gerund → meeting." },
            { type: "error", text: "She is <strong>more taller</strong> than her sister.", options: ["She is", "more taller", "than", "her sister"], answer: 1, pembahasan: "Taller sudah comparative, tidak perlu 'more'." },
            { type: "error", text: "He suggested <strong>to go</strong> to the cinema.", options: ["He", "suggested", "to go", "to the cinema"], answer: 2, pembahasan: "'Suggest' + gerund → going." },
            { type: "error", text: "The book <strong>who</strong> I read was very interesting.", options: ["The book", "who", "I read", "was very interesting"], answer: 1, pembahasan: "Untuk benda menggunakan 'which/that', bukan 'who'." },
            { type: "error", text: "She <strong>have</strong> lived here since 2010.", options: ["She", "have", "lived", "since 2010"], answer: 1, pembahasan: "She singular → has." },
            { type: "error", text: "This is the <strong>more</strong> expensive car in the showroom.", options: ["This is", "more", "expensive car", "in the showroom"], answer: 1, pembahasan: "Superlative → most expensive." },
            { type: "error", text: "They <strong>was</strong> playing football when it rained.", options: ["They", "was", "playing football", "when it rained"], answer: 1, pembahasan: "They plural → were." },
            { type: "error", text: "She is <strong>enough smart</strong> to solve the problem.", options: ["She is", "enough smart", "to solve", "the problem"], answer: 1, pembahasan: "Urutan yang benar: smart enough." },
            { type: "error", text: "The reason <strong>because</strong> he was late is unknown.", options: ["The reason", "because", "he was late", "is unknown"], answer: 1, pembahasan: "The reason that/why, bukan 'because'." },
            { type: "error", text: "She <strong>didn't went</strong> to school yesterday.", options: ["She", "didn't went", "to school", "yesterday"], answer: 1, pembahasan: "Did not + V1 → go, bukan went." },
            { type: "error", text: "I have <strong>never saw</strong> such a beautiful view.", options: ["I have", "never saw", "such a", "beautiful view"], answer: 1, pembahasan: "Present Perfect → have seen." },
            { type: "error", text: "Each of the students <strong>are</strong> responsible for their work.", options: ["Each of", "the students", "are", "for their work"], answer: 2, pembahasan: "Each + singular verb → is." },
            { type: "error", text: "She is <strong>more young</strong> than her brother.", options: ["She is", "more young", "than", "her brother"], answer: 1, pembahasan: "Younger, bukan more young." },
            { type: "error", text: "He is <strong>interested on</strong> learning new languages.", options: ["He is", "interested on", "learning", "new languages"], answer: 1, pembahasan: "Interested in, bukan on." },
            { type: "error", text: "The news <strong>are</strong> very surprising.", options: ["The news", "are", "very", "surprising"], answer: 1, pembahasan: "News adalah uncountable singular → is." },
            { type: "error", text: "She <strong>use to</strong> live in Bandung.", options: ["She", "use to", "live", "in Bandung"], answer: 1, pembahasan: "Used to, bukan use to." },
            { type: "error", text: "I <strong>didn't see</strong> nobody at the party.", options: ["I", "didn't see", "nobody", "at the party"], answer: 2, pembahasan: "Double negative → anyone/somebody." },
            { type: "error", text: "The police <strong>is</strong> investigating the case.", options: ["The police", "is", "investigating", "the case"], answer: 1, pembahasan: "Police plural → are." },

            // Additional Structure Questions (51-75)
            { type: "structure", text: "She ________ a shower when the phone rang.", options: ["had", "was having", "has", "is having"], answer: 1, pembahasan: "Past Continuous untuk kejadian yang sedang berlangsung." },
            { type: "structure", text: "I'd rather ________ at home tonight.", options: ["stay", "to stay", "staying", "stayed"], answer: 0, pembahasan: "'Would rather' + V1." },
            { type: "structure", text: "The concert ________ by thousands of people.", options: ["attended", "was attended", "attending", "to attend"], answer: 1, pembahasan: "Passive voice: was attended." },
            { type: "structure", text: "She is the girl ________ mother is a doctor.", options: ["who", "whom", "which", "whose"], answer: 3, pembahasan: "'Whose' menunjukkan kepemilikan." },
            { type: "structure", text: "If she had studied harder, she ________ the exam.", options: ["passed", "would pass", "would have passed", "had passed"], answer: 2, pembahasan: "Conditional type 3: would have + V3." },
            { type: "structure", text: "He is ________ to be a great musician.", options: ["consider", "considered", "considering", "to consider"], answer: 1, pembahasan: "Passive: is considered." },
            { type: "structure", text: "________ in heavy traffic, we arrived late.", options: ["Caught", "Catching", "To catch", "Catch"], answer: 0, pembahasan: "Past participle sebagai keterangan." },
            { type: "structure", text: "She has difficulty ________ English.", options: ["speak", "to speak", "speaking", "spoken"], answer: 2, pembahasan: "Have difficulty + V-ing." },
            { type: "structure", text: "The more he ate, ________ he became.", options: ["fuller", "the fuller", "fullest", "the fullest"], answer: 1, pembahasan: "The + comparative, the + comparative." },
            { type: "structure", text: "She ________ to be a doctor since she was a child.", options: ["wanted", "has wanted", "had wanted", "was wanting"], answer: 1, pembahasan: "Present Perfect untuk keinginan sejak masa lalu." },
            { type: "structure", text: "The building ________ in 1990 is still standing.", options: ["built", "building", "to build", "builds"], answer: 0, pembahasan: "Past participle sebagai adjective." },
            { type: "structure", text: "She spends her free time ________ books.", options: ["read", "to read", "reading", "reads"], answer: 2, pembahasan: "Spend time + V-ing." },
            { type: "structure", text: "The reason ________ he was absent is unknown.", options: ["why", "that", "which", "who"], answer: 0, pembahasan: "'Why' untuk alasan." },
            { type: "structure", text: "She is ________ of the two sisters.", options: ["taller", "the taller", "tallest", "the tallest"], answer: 1, pembahasan: "Comparative untuk dua orang." },
            { type: "structure", text: "The more you save, ________ you will have.", options: ["more", "the more", "most", "the most"], answer: 1, pembahasan: "The + comparative, the + comparative." },
            { type: "structure", text: "She ________ her keys. She can't find them anywhere.", options: ["lost", "has lost", "had lost", "was losing"], answer: 1, pembahasan: "Present Perfect untuk kejadian yang masih berakibat." },
            { type: "structure", text: "He is the man ________ I met yesterday.", options: ["who", "whom", "which", "whose"], answer: 1, pembahasan: "'Whom' sebagai objek." },
            { type: "structure", text: "By the time you arrive, we ________ dinner.", options: ["finish", "will finish", "will have finished", "have finished"], answer: 2, pembahasan: "Future Perfect." },
            { type: "structure", text: "She is used to ________ alone.", options: ["live", "to live", "living", "lived"], answer: 2, pembahasan: "Be used to + V-ing." },
            { type: "structure", text: "The problem is ________ difficult to solve.", options: ["too", "so", "very", "such"], answer: 0, pembahasan: "'Too + adjective + to infinitive'." },
            { type: "structure", text: "She insisted ________ seeing the manager.", options: ["on", "in", "at", "for"], answer: 0, pembahasan: "Insist on + V-ing." },
            { type: "structure", text: "________ the rain, we went out.", options: ["Although", "Despite", "Because", "However"], answer: 1, pembahasan: "Despite + noun." },
            { type: "structure", text: "She is ________ to be a lawyer.", options: ["enough smart", "smart enough", "too smart", "so smart"], answer: 1, pembahasan: "Adjective + enough." },
            { type: "structure", text: "The committee ________ in disagreement.", options: ["is", "am", "are", "be"], answer: 0, pembahasan: "Committee sebagai kesatuan → singular." },
            { type: "structure", text: "She can't help ________ when she sees him.", options: ["laugh", "to laugh", "laughing", "laughed"], answer: 2, pembahasan: "Can't help + V-ing." },

            // Additional Error Questions (76-100)
            { type: "error", text: "She <strong>don't have</strong> enough money to buy that bag.", options: ["She", "don't have", "enough money", "to buy that bag"], answer: 1, pembahasan: "She doesn't have, bukan don't have." },
            { type: "error", text: "He is <strong>enough strong</strong> to lift the box.", options: ["He is", "enough strong", "to lift", "the box"], answer: 1, pembahasan: "Strong enough, bukan enough strong." },
            { type: "error", text: "She is <strong>interest</strong> in learning Japanese.", options: ["She is", "interest", "in learning", "Japanese"], answer: 1, pembahasan: "Interested (adjective), bukan interest." },
            { type: "error", text: "They <strong>has</strong> completed the project.", options: ["They", "has", "completed", "the project"], answer: 1, pembahasan: "They have, bukan has." },
            { type: "error", text: "This is the <strong>more</strong> delicious food I've ever tasted.", options: ["This is", "more", "delicious food", "I've ever tasted"], answer: 1, pembahasan: "Most delicious, bukan more delicious." },
            { type: "error", text: "She <strong>go</strong> to school by bus every day.", options: ["She", "go", "to school", "by bus every day"], answer: 1, pembahasan: "She goes, bukan go." },
            { type: "error", text: "He <strong>didn't came</strong> to the party last night.", options: ["He", "didn't came", "to the party", "last night"], answer: 1, pembahasan: "Didn't come, bukan didn't came." },
            { type: "error", text: "She is <strong>the most tall</strong> girl in the class.", options: ["She is", "the most tall", "girl", "in the class"], answer: 1, pembahasan: "The tallest, bukan the most tall." },
            { type: "error", text: "I look forward to <strong>see</strong> you again.", options: ["I look forward", "to see", "you", "again"], answer: 1, pembahasan: "To seeing (gerund)." },
            { type: "error", text: "She <strong>didn't see</strong> someone at the door.", options: ["She", "didn't see", "someone", "at the door"], answer: 2, pembahasan: "Kalimat negatif pakai anyone." },
            { type: "error", text: "The news <strong>were</strong> very shocking.", options: ["The news", "were", "very", "shocking"], answer: 1, pembahasan: "News singular → was." },
            { type: "error", text: "He is <strong>more old</strong> than his brother.", options: ["He is", "more old", "than", "his brother"], answer: 1, pembahasan: "Older, bukan more old." },
            { type: "error", text: "She <strong>use to</strong> play tennis when she was young.", options: ["She", "use to", "play tennis", "when she was young"], answer: 1, pembahasan: "Used to, bukan use to." },
            { type: "error", text: "The police <strong>is</strong> looking for the suspect.", options: ["The police", "is", "looking for", "the suspect"], answer: 1, pembahasan: "Police plural → are." },
            { type: "error", text: "She is <strong>interesting</strong> in art.", options: ["She is", "interesting", "in", "art"], answer: 1, pembahasan: "Interested, bukan interesting." },
            { type: "error", text: "He <strong>don't</strong> like coffee.", options: ["He", "don't", "like", "coffee"], answer: 1, pembahasan: "He doesn't, bukan don't." },
            { type: "error", text: "This is the <strong>more</strong> expensive restaurant in town.", options: ["This is", "more", "expensive restaurant", "in town"], answer: 1, pembahasan: "Most expensive, bukan more expensive." },
            { type: "error", text: "She <strong>didn't went</strong> to the party.", options: ["She", "didn't went", "to the", "party"], answer: 1, pembahasan: "Didn't go, bukan didn't went." },
            { type: "error", text: "The reason <strong>because</strong> he left is unknown.", options: ["The reason", "because", "he left", "is unknown"], answer: 1, pembahasan: "The reason that/why." },
            { type: "error", text: "Each of the boys <strong>are</strong> responsible.", options: ["Each of", "the boys", "are", "responsible"], answer: 2, pembahasan: "Each + singular verb → is." },
            { type: "error", text: "She is <strong>more young</strong> than her sister.", options: ["She is", "more young", "than", "her sister"], answer: 1, pembahasan: "Younger, bukan more young." },
            { type: "error", text: "He <strong>has went</strong> to the store.", options: ["He", "has went", "to the", "store"], answer: 1, pembahasan: "Has gone, bukan has went." },
            { type: "error", text: "She <strong>enjoy</strong> watching movies.", options: ["She", "enjoy", "watching", "movies"], answer: 1, pembahasan: "She enjoys, bukan enjoy." },
            { type: "error", text: "I have <strong>never saw</strong> that movie.", options: ["I have", "never saw", "that", "movie"], answer: 1, pembahasan: "Have never seen." },
            { type: "error", text: "She is <strong>more happier</strong> now.", options: ["She is", "more happier", "now", "than before"], answer: 1, pembahasan: "Happier (sudah comparative)." }
        ];

        // State
        let currentIndex = 0;
        let userAnswers = new Array(toeflQuestions.length).fill(null);
        let score = 0;
        let answered = new Array(toeflQuestions.length).fill(false);
        let timerSeconds = 0;
        let timerInterval = null;
        let quizFinished = false;

        // DOM Elements
        const soalContainer = document.getElementById('soalContainer');
        const scoreElement = document.getElementById('score');
        const currentQuestionDisplay = document.getElementById('currentQuestionDisplay');
        const timerElement = document.getElementById('timer');
        const progressFill = document.getElementById('progressFill');

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!quizFinished) {
                    timerSeconds++;
                    const minutes = Math.floor(timerSeconds / 60);
                    const seconds = timerSeconds % 60;
                    timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        function updateProgress() {
            const answeredCount = answered.filter(a => a === true).length;
            const progress = (answeredCount / toeflQuestions.length) * 100;
            progressFill.style.width = progress + '%';
        }

        function updateScore() {
            score = 0;
            for (let i = 0; i < toeflQuestions.length; i++) {
                if (userAnswers[i] !== null && userAnswers[i] === toeflQuestions[i].answer) {
                    score++;
                }
            }
            scoreElement.textContent = score;
        }

        function renderQuestion() {
            const q = toeflQuestions[currentIndex];
            const isAnswered = answered[currentIndex];
            const selectedAnswer = userAnswers[currentIndex];

            let html = `
                <div class="soal-card">
                    <div class="soal-meta">
                        <span class="soal-number"><i class="fas fa-bookmark"></i> Soal ${currentIndex + 1} dari ${toeflQuestions.length}</span>
                        <span class="soal-type-badge">${q.type === 'structure' ? '📝 Structure' : '🔍 Written Expression'}</span>
                    </div>

                    <div class="soal-text">
                        ${q.text}
                    </div>

                    <div class="options">
            `;

            q.options.forEach((opt, idx) => {
                const letter = String.fromCharCode(65 + idx);
                let stateClass = '';
                let iconHtml = '';

                if (isAnswered) {
                    if (idx === q.answer) {
                        stateClass = 'correct';
                        iconHtml = '<i class="fas fa-check-circle option-icon"></i>';
                    } else if (selectedAnswer === idx) {
                        stateClass = 'wrong';
                        iconHtml = '<i class="fas fa-times-circle option-icon"></i>';
                    }
                    stateClass += ' disabled';
                } else if (selectedAnswer === idx) {
                    stateClass = 'selected';
                }

                html += `
                    <div class="option-card ${stateClass}" onclick="selectAnswer(${idx})">
                        <div class="option-letter">${letter}</div>
                        <div class="option-label">${opt}</div>
                        ${iconHtml}
                    </div>
                `;
            });

            html += `
                    </div>

                    <div class="btn-group">
                        <button class="btn-check" onclick="checkAnswer()" ${isAnswered ? 'disabled' : ''}><i class="fas fa-check"></i> CEK JAWABAN</button>
                        <button class="btn-next" onclick="nextQuestion()"><i class="fas fa-arrow-right"></i> SOAL BERIKUTNYA</button>
                        <button class="btn-pembahasan" onclick="togglePembahasan()"><i class="fas fa-lightbulb"></i> PEMBAHASAN</button>
                        <button class="btn-reset" onclick="resetQuiz()"><i class="fas fa-redo"></i> RESET</button>
                    </div>

                    <div class="feedback" id="feedback"></div>

                    <div class="pembahasan" id="pembahasan">
                        <h4><i class="fas fa-info-circle"></i> Pembahasan Soal:</h4>
                        <p>${q.pembahasan}</p>
                    </div>
                </div>
            `;

            soalContainer.innerHTML = html;
            currentQuestionDisplay.textContent = `${currentIndex + 1} / ${toeflQuestions.length}`;
            updateProgress();
        }

        function selectAnswer(answerIndex) {
            if (answered[currentIndex]) return;
            userAnswers[currentIndex] = answerIndex;
            renderQuestion();
        }

        function checkAnswer() {
            if (answered[currentIndex]) {
                showFeedback('⚠️ Kamu sudah menjawab soal ini! Lanjut ke soal berikutnya.', 'wrong');
                return;
            }

            const selected = userAnswers[currentIndex];
            if (selected === null) {
                showFeedback('⚠️ Silakan pilih jawaban (A, B, C, atau D) dulu ya!', 'wrong');
                return;
            }

            const q = toeflQuestions[currentIndex];
            const isCorrect = (selected === q.answer);

            answered[currentIndex] = true;
            updateScore();
            renderQuestion();

            // Tampilkan feedback setelah renderQuestion agar tidak terhapus
            if (isCorrect) {
                showFeedback(`✅ BENAR! Jawaban yang tepat adalah ${String.fromCharCode(65 + q.answer)}. ${q.options[q.answer]}`, 'correct');
                createConfetti();
            } else {
                showFeedback(`❌ SALAH! Jawaban yang benar adalah ${String.fromCharCode(65 + q.answer)}. ${q.options[q.answer]}`, 'wrong');
            }
        }

        function showFeedback(message, type) {
            const feedbackDiv = document.getElementById('feedback');
            if (feedbackDiv) {
                feedbackDiv.innerHTML = message;
                feedbackDiv.className = `feedback ${type}`;
                feedbackDiv.style.display = 'block';
            }
        }

        function togglePembahasan() {
            const pembahasanDiv = document.getElementById('pembahasan');
            if (pembahasanDiv) {
                pembahasanDiv.classList.toggle('show');
            }
        }

        function nextQuestion() {
            if (currentIndex + 1 < toeflQuestions.length) {
                currentIndex++;
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            quizFinished = true;
            if (timerInterval) clearInterval(timerInterval);

            const finalScore = score;
            const percentage = Math.round((finalScore / toeflQuestions.length) * 100);
            let toeflScaled = Math.round(200 + (percentage / 100) * (677 - 200));
            toeflScaled = Math.max(200, Math.min(677, toeflScaled));

            let predicate = '';
            let predicateClass = '';
            if (percentage >= 80) {
                predicate = '🏆 EXCELLENT! Pemahaman Structure & Written Expression kamu luar biasa!';
                predicateClass = 'excellent';
            } else if (percentage >= 60) {
                predicate = '✨ GOOD! Sudah cukup baik, terus pertajam latihan pola soal!';
                predicateClass = 'good';
            } else {
                predicate = '📚 PERLU LATIHAN! Pelajari kembali aturan grammar dan coba lagi!';
                predicateClass = 'fair';
            }

            let wrongAnswersHtml = '';
            let wrongCount = 0;
            for (let i = 0; i < toeflQuestions.length; i++) {
                if (userAnswers[i] !== null && userAnswers[i] !== toeflQuestions[i].answer) {
                    wrongCount++;
                    const q = toeflQuestions[i];
                    wrongAnswersHtml += `
                        <div class="review-item">
                            <div class="review-question">Soal #${i + 1}: ${q.text}</div>
                            <div class="review-user-ans">❌ Jawabanmu: ${String.fromCharCode(65 + userAnswers[i])}. ${q.options[userAnswers[i]]}</div>
                            <div class="review-correct-ans">✅ Jawaban Benar: ${String.fromCharCode(65 + q.answer)}. ${q.options[q.answer]}</div>
                            <div class="review-pembahasan">💡 ${q.pembahasan}</div>
                        </div>
                    `;
                }
            }

            const resultHtml = `
                <div class="result-card">
                    <h2>🎉 HASIL LATIHAN TOEFL 🎉</h2>
                    <div class="final-score">${finalScore} / ${toeflQuestions.length}</div>
                    <div class="toefl-score">📊 Estimasi Skor TOEFL: ${toeflScaled} / 677</div>
                    <div class="predicate ${predicateClass}">${predicate}</div>
                    <div style="color: #9ca3cf; font-size: 14px;">⏱️ Waktu Pengerjaan: ${timerElement.textContent}</div>
                    
                    <div>
                        <button class="btn-restart" onclick="resetQuiz()"><i class="fas fa-redo"></i> MULAI LAGI</button>
                    </div>

                    ${wrongCount > 0 ? `
                        <div style="margin-top: 35px; text-align: left;">
                            <h3 style="color: #f87171; margin-bottom: 12px; font-size: 17px;"><i class="fas fa-clipboard-list"></i> Review Soal yang Salah (${wrongCount} Soal):</h3>
                            <div class="review-section">
                                ${wrongAnswersHtml}
                            </div>
                        </div>
                    ` : '<div style="margin-top: 30px; color: #34d399; font-weight: 700; font-size: 18px;">🎯 SEMPURNA! Semua soal dijawab dengan benar!</div>'}
                </div>
            `;

            soalContainer.innerHTML = resultHtml;
            progressFill.style.width = '100%';
        }

        function resetQuiz() {
            quizFinished = false;
            currentIndex = 0;
            userAnswers = new Array(toeflQuestions.length).fill(null);
            score = 0;
            answered = new Array(toeflQuestions.length).fill(false);
            timerSeconds = 0;
            timerElement.textContent = '00:00';
            scoreElement.textContent = '0';

            if (timerInterval) clearInterval(timerInterval);
            startTimer();
            renderQuestion();
        }

        function createConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = `hsl(${Math.random() * 360}, 90%, 65%)`;
                confetti.style.top = '-10px';
                confetti.style.width = Math.random() * 8 + 4 + 'px';
                confetti.style.height = Math.random() * 8 + 4 + 'px';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 2000);
            }
        }

        // Initialize
        startTimer();
        renderQuestion();
    </script>
</body>
