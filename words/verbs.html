<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verbs · Flashcard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="icon" href="asset/logo.png">
    <style>
        /* ===== STYLE SAMA DENGAN nouns.html ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0f0e1a, #1a1a2e);
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-left .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #9ca3cf;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-left .back-btn:hover {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
        }

        .header-left h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #34d399, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-right .badge {
            background: rgba(52, 211, 153, 0.12);
            padding: 5px 16px;
            border-radius: 40px;
            color: #34d399;
            font-size: 13px;
            font-weight: 600;
        }

        .flashcard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding: 10px 0 30px;
        }

        .card {
            width: 100%;
            max-width: 600px;
            min-height: 250px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 30px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(52, 211, 153, 0.2);
        }

        .card .indonesia {
            font-size: 42px;
            font-weight: 700;
            color: #f0f3fa;
            margin-bottom: 8px;
        }

        .card .hint {
            font-size: 16px;
            color: #6e739b;
            margin-bottom: 16px;
        }

        .card .english {
            font-size: 36px;
            font-weight: 700;
            color: #34d399;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .card .english.show {
            display: block;
        }

        .card .card-number {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 14px;
            color: #4a4a6a;
            font-weight: 600;
        }

        .card .click-hint {
            position: absolute;
            bottom: 16px;
            color: #4a4a6a;
            font-size: 13px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 600px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px 20px;
            color: #d6defa;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        .option-btn:hover {
            background: rgba(52, 211, 153, 0.08);
            border-color: rgba(52, 211, 153, 0.2);
            transform: scale(1.02);
        }

        .option-btn.correct {
            background: rgba(52, 211, 153, 0.15);
            border-color: #34d399;
            color: #34d399;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
            color: #fca5a5;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .nav-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 12px 28px;
            color: #d6defa;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover {
            background: rgba(52, 211, 153, 0.08);
            border-color: rgba(52, 211, 153, 0.2);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-btn.primary {
            background: rgba(52, 211, 153, 0.12);
            border-color: rgba(52, 211, 153, 0.2);
            color: #34d399;
        }

        .nav-btn.primary:hover {
            background: rgba(52, 211, 153, 0.2);
        }

        .score-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            width: 100%;
            max-width: 600px;
        }

        .score-bar .item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            color: #9ca3cf;
        }

        .score-bar .item .num {
            font-weight: 700;
            font-size: 18px;
        }

        .score-bar .item .num.gold {
            color: #fbbf24;
        }

        .score-bar .item .num.green {
            color: #34d399;
        }

        .score-bar .item .num.red {
            color: #f87171;
        }

        .footer {
            text-align: center;
            color: #4a4a6a;
            padding: 30px 0 10px;
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 20px;
        }

        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .header-left h1 {
                font-size: 20px;
            }

            .card .indonesia {
                font-size: 30px;
            }

            .card .english {
                font-size: 28px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .card {
                min-height: 200px;
                padding: 30px 20px;
            }

            .score-bar {
                flex-wrap: wrap;
                gap: 12px;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a5a;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <div class="header-left">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
                <h1><i class="fas fa-running"></i> Verbs</h1>
            </div>
            <div class="header-right">
                <span class="badge"><i class="fas fa-list"></i> 100 Kata</span>
                <span class="badge" style="background:rgba(96,165,250,0.12);color:#60a5fa;">
                    <i class="fas fa-random"></i> Acak
                </span>
            </div>
        </div>

        <div class="flashcard-container">
            <div class="score-bar">
                <div class="item"><i class="fas fa-star" style="color:#fbbf24;"></i> Skor: <span class="num gold"
                        id="scoreDisplay">0</span></div>
                <div class="item"><i class="fas fa-check-circle" style="color:#34d399;"></i> Benar: <span
                        class="num green" id="correctDisplay">0</span></div>
                <div class="item"><i class="fas fa-times-circle" style="color:#f87171;"></i> Salah: <span
                        class="num red" id="wrongDisplay">0</span></div>
                <div class="item"><i class="fas fa-flag" style="color:#60a5fa;"></i> Soal: <span class="num"
                        id="questionCounter">1</span>/<span id="totalQuestions">100</span></div>
            </div>

            <div class="card" id="flashcard" onclick="toggleAnswer()">
                <span class="card-number" id="cardNumber">#1</span>
                <div class="indonesia" id="indonesiaWord">Loading...</div>
                <div class="hint">👆 Klik kartu untuk lihat jawaban</div>
                <div class="english" id="englishWord">---</div>
                <div class="click-hint"><i class="fas fa-mouse-pointer"></i> Klik untuk membalik</div>
            </div>

            <div class="options" id="optionsContainer"></div>

            <div class="nav-buttons">
                <button class="nav-btn" id="prevBtn" onclick="prevQuestion()">
                    <i class="fas fa-chevron-left"></i> Sebelumnya
                </button>
                <button class="nav-btn primary" id="resetBtn" onclick="resetQuiz()">
                    <i class="fas fa-redo"></i> Reset
                </button>
                <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">
                    Selanjutnya <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <div class="footer">
            <span style="color:#34d399;">Klik kartu</span> untuk melihat jawaban • Mode <span
                style="color:#60a5fa;">Kuis</span> pilih 4 opsi
        </div>
    </div>

    <script>
        // ============================================================
        //  DATA 100 KATA KERJA (VERBS)
        // ============================================================
        const data = [
            { en: "eat", id: "makan" },
            { en: "drink", id: "minum" },
            { en: "sleep", id: "tidur" },
            { en: "walk", id: "berjalan" },
            { en: "run", id: "berlari" },
            { en: "jump", id: "melompat" },
            { en: "sit", id: "duduk" },
            { en: "stand", id: "berdiri" },
            { en: "lie", id: "berbaring" },
            { en: "fall", id: "jatuh" },
            { en: "rise", id: "bangkit" },
            { en: "go", id: "pergi" },
            { en: "come", id: "datang" },
            { en: "arrive", id: "tiba" },
            { en: "leave", id: "pergi/meninggalkan" },
            { en: "enter", id: "masuk" },
            { en: "return", id: "kembali" },
            { en: "stay", id: "tinggal" },
            { en: "wait", id: "menunggu" },
            { en: "follow", id: "mengikuti" },
            { en: "lead", id: "memimpin" },
            { en: "bring", id: "membawa" },
            { en: "take", id: "mengambil" },
            { en: "give", id: "memberi" },
            { en: "receive", id: "menerima" },
            { en: "send", id: "mengirim" },
            { en: "get", id: "mendapatkan" },
            { en: "have", id: "memiliki" },
            { en: "use", id: "menggunakan" },
            { en: "put", id: "meletakkan" },
            { en: "set", id: "mengatur" },
            { en: "place", id: "menempatkan" },
            { en: "open", id: "membuka" },
            { en: "close", id: "menutup" },
            { en: "shut", id: "menutup" },
            { en: "turn", id: "berputar" },
            { en: "move", id: "bergerak" },
            { en: "stop", id: "berhenti" },
            { en: "start", id: "memulai" },
            { en: "finish", id: "menyelesaikan" },
            { en: "continue", id: "melanjutkan" },
            { en: "try", id: "mencoba" },
            { en: "attempt", id: "berusaha" },
            { en: "succeed", id: "berhasil" },
            { en: "fail", id: "gagal" },
            { en: "learn", id: "belajar" },
            { en: "teach", id: "mengajar" },
            { en: "study", id: "belajar" },
            { en: "practice", id: "berlatih" },
            { en: "improve", id: "meningkatkan" },
            { en: "write", id: "menulis" },
            { en: "read", id: "membaca" },
            { en: "speak", id: "berbicara" },
            { en: "listen", id: "mendengarkan" },
            { en: "hear", id: "mendengar" },
            { en: "see", id: "melihat" },
            { en: "watch", id: "menonton" },
            { en: "look", id: "melihat/memandang" },
            { en: "find", id: "menemukan" },
            { en: "lose", id: "kehilangan" },
            { en: "keep", id: "menjaga" },
            { en: "hold", id: "memegang" },
            { en: "carry", id: "membawa" },
            { en: "push", id: "mendorong" },
            { en: "pull", id: "menarik" },
            { en: "lift", id: "mengangkat" },
            { en: "drop", id: "menjatuhkan" },
            { en: "catch", id: "menangkap" },
            { en: "throw", id: "melempar" },
            { en: "hit", id: "memukul" },
            { en: "kick", id: "menendang" },
            { en: "break", id: "memecahkan" },
            { en: "fix", id: "memperbaiki" },
            { en: "build", id: "membangun" },
            { en: "destroy", id: "menghancurkan" },
            { en: "create", id: "menciptakan" },
            { en: "make", id: "membuat" },
            { en: "do", id: "melakukan" },
            { en: "say", id: "mengatakan" },
            { en: "tell", id: "memberitahu" },
            { en: "ask", id: "bertanya" },
            { en: "answer", id: "menjawab" },
            { en: "explain", id: "menjelaskan" },
            { en: "describe", id: "menggambarkan" },
            { en: "discuss", id: "mendiskusikan" },
            { en: "agree", id: "setuju" },
            { en: "disagree", id: "tidak setuju" },
            { en: "decide", id: "memutuskan" },
            { en: "choose", id: "memilih" },
            { en: "prefer", id: "lebih suka" },
            { en: "need", id: "membutuhkan" },
            { en: "want", id: "ingin" },
            { en: "wish", id: "berharap" },
            { en: "hope", id: "berharap" },
            { en: "believe", id: "percaya" },
            { en: "think", id: "berpikir" },
            { en: "know", id: "mengetahui" },
            { en: "understand", id: "memahami" },
            { en: "remember", id: "mengingat" },
            { en: "forget", id: "melupakan" }
        ];

        // ============================================================
        //  GAME ENGINE (SAMA DENGAN nouns.html)
        // ============================================================
        const total = data.length;
        let currentIndex = 0;
        let score = 0;
        let correct = 0;
        let wrong = 0;
        let isAnswered = false;

        const indonesiaWord = document.getElementById('indonesiaWord');
        const englishWord = document.getElementById('englishWord');
        const cardNumber = document.getElementById('cardNumber');
        const questionCounter = document.getElementById('questionCounter');
        const totalQuestions = document.getElementById('totalQuestions');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const correctDisplay = document.getElementById('correctDisplay');
        const wrongDisplay = document.getElementById('wrongDisplay');
        const optionsContainer = document.getElementById('optionsContainer');
        const flashcard = document.getElementById('flashcard');

        totalQuestions.textContent = total;

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getOptions(correctEn, correctId) {
            let others = data.filter(item => item.en !== correctEn);
            shuffle(others);
            let selected = others.slice(0, 3);
            let options = selected.map(item => item.en);
            options.push(correctEn);
            shuffle(options);
            return options;
        }

        function loadQuestion(index) {
            const item = data[index];
            if (!item) return;

            indonesiaWord.textContent = item.id;
            englishWord.textContent = item.en;
            englishWord.classList.remove('show');
            cardNumber.textContent = `#${index + 1}`;
            questionCounter.textContent = index + 1;
            isAnswered = false;

            const options = getOptions(item.en, item.id);
            optionsContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => selectAnswer(btn, opt, item.en);
                optionsContainer.appendChild(btn);
            });

            document.querySelectorAll('.option-btn').forEach(b => b.disabled = false);
            flashcard.style.borderColor = 'rgba(255,255,255,0.06)';
        }

        function selectAnswer(btn, selected, correctEn) {
            if (isAnswered) return;
            isAnswered = true;

            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            if (selected === correctEn) {
                btn.classList.add('correct');
                score += 10;
                correct++;
                flashcard.style.borderColor = '#34d399';
                englishWord.classList.add('show');
            } else {
                btn.classList.add('wrong');
                wrong++;
                flashcard.style.borderColor = '#ef4444';
                allBtns.forEach(b => {
                    if (b.textContent === correctEn) {
                        b.classList.add('correct');
                    }
                });
                englishWord.classList.add('show');
            }

            updateScore();
        }

        function toggleAnswer() {
            if (isAnswered) return;
            englishWord.classList.toggle('show');
        }

        function updateScore() {
            scoreDisplay.textContent = score;
            correctDisplay.textContent = correct;
            wrongDisplay.textContent = wrong;
        }

        function nextQuestion() {
            if (currentIndex < total - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                alert('🎉 Selamat! Kamu sudah menyelesaikan semua soal!');
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
        }

        function resetQuiz() {
            currentIndex = 0;
            score = 0;
            correct = 0;
            wrong = 0;
            updateScore();
            loadQuestion(0);
        }

        shuffle(data);
        loadQuestion(0);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuestion();
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === ' ') {
                e.preventDefault();
                toggleAnswer();
            }
        });
    </script>

</body>

</html>
